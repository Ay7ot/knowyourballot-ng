name: Ingest INEC candidate lists

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/sources.json, scripts/ingest_inec.py, scripts/build_ballot.py]
  schedule:
    - cron: "0 5 * * *" # daily, 6am Lagos time: INEC updates lists after substitutions and court orders

permissions:
  contents: read # data writes use DATA_BOT_TOKEN so the main ruleset applies

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download and parse INEC documents
        run: python scripts/ingest_inec.py
      - name: Join candidates to the electoral map
        run: python scripts/build_ballot.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate the data contract
        run: npm run test:data
      - name: Keep the source PDFs for 30 days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inec-pdfs
          path: .cache/inec/
          retention-days: 30
      - name: Open or update the data pull request
        env:
          DATA_BOT_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
          MERGE_TIMEOUT_SECONDS: "1500"
        run: |
          git add data/candidates data/ballot.json
          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Automated INEC ingest from the daily workflow.

          This pull request was opened by the data workflow. It updates the candidate lists, the ballot join and the ingest report. CI gates the merge; the pull request stays as an audit trail.
          EOF
          scripts/open_data_pr.sh data/ingest \
            "data: refresh INEC candidate lists" \
            "data: refresh INEC candidate lists" \
            "$RUNNER_TEMP/pr-body.md"
