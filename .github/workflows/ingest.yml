name: Ingest INEC candidate lists

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/sources.json, scripts/ingest_inec.py, scripts/build_ballot.py]
  schedule:
    - cron: "0 5 * * *" # daily, 6am Lagos time: INEC updates lists after substitutions and court orders

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download and parse INEC documents
        run: python scripts/ingest_inec.py
      - name: Join candidates to the electoral map
        run: python scripts/build_ballot.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate the data contract
        run: npm run test:data
      - name: Keep the source PDFs for 30 days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inec-pdfs
          path: .cache/inec/
          retention-days: 30
      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ballot-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates data/ballot.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: refresh INEC candidate lists"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
