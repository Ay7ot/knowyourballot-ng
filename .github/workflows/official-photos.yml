name: Official candidate photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/official_handles.json, scripts/fetch_official_photos.py]

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_official_photos.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate the data contract
        run: npm run test:data
      - name: Commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ballot-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/official_photos.json public/candidates/official
          git diff --cached --quiet && exit 0
          git commit -m "data: official candidate photos"
          git pull --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
