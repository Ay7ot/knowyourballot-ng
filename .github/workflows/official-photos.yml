name: Official candidate photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/official_handles.json, scripts/fetch_official_photos.py]

permissions:
  contents: read # data writes use DATA_BOT_TOKEN so the main ruleset applies

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_official_photos.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate the data contract
        run: npm run test:data
      - name: Open or update the data pull request
        env:
          DATA_BOT_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
          MERGE_TIMEOUT_SECONDS: "1500"
        run: |
          git add data/official_photos.json public/candidates/official
          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Automated official X photo refresh for allowlisted candidate accounts.

          These images are not freely licensed. Review the credit and removal link in the diff. CI gates the merge; the pull request stays as an audit trail.
          EOF
          scripts/open_data_pr.sh data/official-photos \
            "data: official candidate photos" \
            "data: official candidate photos" \
            "$RUNNER_TEMP/pr-body.md"
