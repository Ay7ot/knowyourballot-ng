name: Official candidate photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/official_handles.json, scripts/fetch_official_photos.py]

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_official_photos.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate the data contract
        run: npm run test:data
      - name: Commit
        run: |
          git config user.name "ballot-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/official_photos.json public/candidates/official
          git diff --cached --quiet && exit 0
          git commit -m "data: official candidate photos"
          git pull --rebase origin main && git push origin HEAD:main
