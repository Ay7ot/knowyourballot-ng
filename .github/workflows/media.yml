name: Party logos and candidate photos

on:
  workflow_dispatch:
    inputs:
      offices:
        description: "Offices to look up photos for (comma-separated: president,governor,senate,rep,assembly)"
        default: "president,governor,senate"
      recheck:
        description: "Look again at candidates checked in the last 14 days"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [scripts/fetch_party_logos.py, scripts/fetch_candidate_photos.py, data/photo_overrides.json]
  schedule:
    - cron: "30 6 * * 1" # Mondays: pick up substitutions and newly added photos

permissions:
  contents: read # data writes use DATA_BOT_TOKEN so the main ruleset applies

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Party logos from INEC's party profiles
        run: python scripts/fetch_party_logos.py
      - name: Verified candidate photos from Wikidata and Wikimedia Commons
        env:
          RECHECK: ${{ github.event.inputs.recheck }}
          OFFICES: ${{ github.event.inputs.offices || 'president,governor,senate' }}
        run: |
          case "$OFFICES" in
            *[!a-z,]*|"") echo "Invalid offices input"; exit 1;;
          esac
          python scripts/fetch_candidate_photos.py "$OFFICES" | tee photos.log
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate the data contract
        run: npm run test:data
      - name: Open or update the data pull request
        env:
          DATA_BOT_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
          MERGE_TIMEOUT_SECONDS: "1200"
        run: |
          git add data/party_logos.json data/candidate_photos.json data/photo_report.json public/parties public/candidates
          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Automated party logo and Commons photo refresh.

          Review the photo report and the licence fields in the diff. CI gates the merge; the pull request stays as an audit trail.
          EOF
          scripts/open_data_pr.sh data/media \
            "media: refresh party logos and candidate photos" \
            "media: refresh party logos and candidate photos" \
            "$RUNNER_TEMP/pr-body.md"
