name: Party logos and candidate photos

on:
  workflow_dispatch:
    inputs:
      offices:
        description: "Offices to look up photos for (comma-separated: president,governor,senate,rep,assembly)"
        default: "president,governor,senate"
      recheck:
        description: "Look again at candidates checked in the last 14 days"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [scripts/fetch_party_logos.py, scripts/fetch_candidate_photos.py]
  schedule:
    - cron: "30 6 * * 1" # Mondays: pick up substitutions and newly added photos

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Party logos from INEC's party profiles
        run: python scripts/fetch_party_logos.py
      - name: Verified candidate photos from Wikidata and Wikimedia Commons
        env:
          RECHECK: ${{ github.event.inputs.recheck }}
        run: python scripts/fetch_candidate_photos.py "${{ github.event.inputs.offices || 'president,governor,senate' }}" | tee photos.log
      - name: Commit changes
        run: |
          git config user.name "ballot-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/party_logos.json data/candidate_photos.json data/photo_report.json public/parties public/candidates
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "media: refresh party logos and candidate photos"
          git pull --rebase origin main
          git push
