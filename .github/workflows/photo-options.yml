name: Photo options for review

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate id, e.g. president--ndc"
        required: true
      category:
        description: "Commons category name of the person, e.g. Peter Obi"
        required: true

permissions:
  contents: write

jobs:
  options:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch photo options
        env:
          CANDIDATE: ${{ github.event.inputs.candidate }}
          CATEGORY: ${{ github.event.inputs.category }}
        run: |
          case "$CANDIDATE" in
            *[!a-z0-9-]*|"") echo "Invalid candidate id"; exit 1;;
          esac
          python scripts/photo_options.py "$CANDIDATE" "$CATEGORY"
      - name: Push to the photo-review branch (never main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE: ${{ github.event.inputs.candidate }}
        run: |
          git config user.name "ballot-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B photo-review
          git add review
          git commit -m "review: photo options for $CANDIDATE"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" photo-review
